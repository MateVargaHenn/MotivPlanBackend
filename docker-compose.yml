services:
  motivplanbackend.webapi:
    container_name: motivplanbackend.webapi
    image: ${DOCKER_REGISTRY-}motivplanbackendwebapi
    build:
      context: .
      dockerfile: MotivPlanBackend.WebApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      FRONTEND_URL: http://localhost:4200
      ASPNETCORE_URLS: http://+:8080
      MotivPlan__Db__PostGres__ConnectionString: Host=motivplanbackend.database;Port=5432;Database=motivplan;Username=motivplan;Password=motivplan
      MediatR__LicenseKey: eyJhbGciOiJSUzI1NiIsImtpZCI6Ikx1Y2t5UGVubnlTb2Z0d2FyZUxpY2Vuc2VLZXkvYmJiMTNhY2I1OTkwNGQ4OWI0Y2IxYzg1ZjA4OGNjZjkiLCJ0eXAiOiJKV1QifQ..iyp7uKYGQcRUcCpOhh5QPSI1DlHSkKJtmgAbilPNWsCKfLVEqglBhJOXPQJYCtG_MBfYplC0i28fHM0JoGOXVFcEfGYs_-n0Mkw600l2iEbAWSiVDb-oYaGkWNjhlYT0t0uJqpEpXVBjVpeEGMARlR2Sv5kOP-PHiYYLLBb8XjDP4cIOXS-Eu2eCz5tb1Pr0nYuE2hJkJu_9JjJH0-sOfQD-Ykxlpq9ZzSdNZAGYBsPqQL27Qsf6koMnzjESbDxIPAxM5lRf1KtUCx0z9q4kb2_C0O5zfBsiATFcD1A9VnKP0hommrgTuBR7sBK6Q4jZh8czVxTp733xaV9g-0Gkvg
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: motivplan
      RabbitMq__Password: motivplan
      Authentication__Google__ClientId: 385651703458-b1vjr86s4k3l9dhsfivdkvks9hsd87h4.apps.googleusercontent.com
      Authentication__Google__ClientSecret: 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
      APP_SUPERADMIN_EMAIL: ${APP_SUPERADMIN_EMAIL}
      APP_SUPERADMIN_USERNAME: ${APP_SUPERADMIN_USERNAME}
      APP_SUPERADMIN_PASSWORD: ${APP_SUPERADMIN_PASSWORD}
    ports:
      - "3000:8080"
    depends_on:
      - motivplanbackend.database
      - motivplanbackend.seq

  motivplanbackend.database:
    container_name: motivplanbackend.database
    image: postgres:18
    environment:
      POSTGRES_USER: motivplan
      POSTGRES_PASSWORD: motivplan
      POSTGRES_DB: motivplan
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
 
  motivplanbackend.seq:
    container_name: motivplanbackend.seq
    image: datalust/seq:latest
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "5341:5341"
      - 8081:80

  motivplanbackend.rabbitmq:
    container_name: motivplanbackend.rabbitmq
    image: rabbitmq:4-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: motivplan
      RABBITMQ_DEFAULT_PASS: motivplan
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  rabbitmq_data:
