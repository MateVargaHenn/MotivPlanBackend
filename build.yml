name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DOTNET_VERSION: "10.x"
  
jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: MotivPlanBackend

    steps:
      - uses: actions/checkout@v4
  
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore
        run: dotnet restore MotivPlanBackend.sln

      - name: Build
        run: dotnet build MotivPlanBackend.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test MotivPlanBackend.sln --configuration Release --no-restore --no-build

      - name: Publish
        run: dotnet publish MotivPlanBackend.sln --configuration Release --no-restore --no-build
  